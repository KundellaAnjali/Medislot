AWSTemplateFormatVersion: '2010-09-09'
Description: MediSlot Data Stack

Parameters:

  EnvironmentName:
    Type: String

  DBName:
    Type: String

  MasterUsername:
    Type: String

Resources:

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: MediSlot DB Subnet Group

      SubnetIds:
        - Fn::ImportValue:
            !Sub "${EnvironmentName}-PrivateSubnetAId"

        - Fn::ImportValue:
            !Sub "${EnvironmentName}-PrivateSubnetBId"

      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-db-subnet-group"

  MySQLDatabase:
    Type: AWS::RDS::DBInstance
    Properties:

      DBInstanceIdentifier:
        !Sub "${EnvironmentName}-medislot-db"

      Engine: mysql

      EngineVersion: "8.4.11"

      DBInstanceClass: db.t3.micro

      AllocatedStorage: 20

      StorageType: gp3

      DBName:
        !Ref DBName

      MasterUsername:
        !Ref MasterUsername

      MasterUserPassword:
        !Sub "{{resolve:ssm-secure:/medislot/${EnvironmentName}/rds-password}}"

      PubliclyAccessible: false

      MultiAZ: false

      BackupRetentionPeriod: 0

      DeletionProtection: false

      DBSubnetGroupName:
        !Ref DBSubnetGroup

      VPCSecurityGroups:
        - Fn::ImportValue:
            !Sub "${EnvironmentName}-RDSSecurityGroupId"

  UserSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${EnvironmentName}-user-sessions"

      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
        - AttributeName: refresh_token_hash
          AttributeType: S
        - AttributeName: jti
          AttributeType: S

      KeySchema:
        - AttributeName: session_id
          KeyType: HASH

      GlobalSecondaryIndexes:
        - IndexName: RefreshTokenHashIndex
          KeySchema:
            - AttributeName: refresh_token_hash
              KeyType: HASH
          Projection:
            ProjectionType: ALL

        - IndexName: SessionJtiIndex
          KeySchema:
            - AttributeName: jti
              KeyType: HASH
          Projection:
            ProjectionType: ALL

      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  IdempotencyKeysTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${EnvironmentName}-idempotency-keys"

      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: idempotency_key
          AttributeType: S

      KeySchema:
        - AttributeName: idempotency_key
          KeyType: HASH

      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  WaitlistTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${EnvironmentName}-waitlist"

      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: slot_id
          AttributeType: N
        - AttributeName: joined_at
          AttributeType: S
        - AttributeName: patient_id
          AttributeType: N

      KeySchema:
        - AttributeName: slot_id
          KeyType: HASH
        - AttributeName: joined_at
          KeyType: RANGE

      GlobalSecondaryIndexes:
        - IndexName: PatientIdIndex
          KeySchema:
            - AttributeName: patient_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL

      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  WaitlistOffersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${EnvironmentName}-waitlist-offers"

      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: offer_id
          AttributeType: N
        - AttributeName: patient_id
          AttributeType: N

      KeySchema:
        - AttributeName: offer_id
          KeyType: HASH

      GlobalSecondaryIndexes:
        - IndexName: PatientIdIndex
          KeySchema:
            - AttributeName: patient_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  SlotsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${EnvironmentName}-slots-v2"

      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: doctor_id
          AttributeType: N
        - AttributeName: slot_start_time
          AttributeType: S

      KeySchema:
        - AttributeName: doctor_id
          KeyType: HASH
        - AttributeName: slot_start_time
          KeyType: RANGE

  NotificationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${EnvironmentName}-notifications"

      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: notification_id
          AttributeType: N
        - AttributeName: appointment_id
          AttributeType: N

      KeySchema:
        - AttributeName: notification_id
          KeyType: HASH

      GlobalSecondaryIndexes:
        - IndexName: AppointmentIdIndex
          KeySchema:
            - AttributeName: appointment_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL


  AssetsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        !Sub "${EnvironmentName}-medislot-assets-${AWS::AccountId}"
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - Content-Type
            AllowedMethods:
              - PUT
            AllowedOrigins:
              - "*"
            ExposedHeaders:
              - ETag
            MaxAge: 300

  RDSHostParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/medislot/${EnvironmentName}/rds-host"
      Type: String
      Value: !GetAtt MySQLDatabase.Endpoint.Address

  RDSPortParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/medislot/${EnvironmentName}/rds-port"
      Type: String
      Value: !GetAtt MySQLDatabase.Endpoint.Port

  RDSDatabaseParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/medislot/${EnvironmentName}/rds-database"
      Type: String
      Value: !Ref DBName

  RDSUserParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/medislot/${EnvironmentName}/rds-user"
      Type: String
      Value: !Ref MasterUsername

  AccessTokenExpiryParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/medislot/${EnvironmentName}/access-token-expiry"
      Type: String
      Value: "15"

  RefreshTokenExpiryParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/medislot/${EnvironmentName}/refresh-token-expiry"
      Type: String
      Value: "7"

  BookingWindowDaysParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/medislot/${EnvironmentName}/booking-window-days"
      Type: String
      Value: "30"
      Description: Rolling slot materialization window in days

  MaxActiveBookingsParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/medislot/${EnvironmentName}/patient-booking/max-active-bookings"
      Type: String
      Value: "3"
      Description: Maximum number of upcoming active appointments per patient per doctor

  Refund48HourThresholdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/medislot/${EnvironmentName}/REFUND_48_HOUR_THRESHOLD"
      Type: String
      Value: "48"

  Refund24HourThresholdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/medislot/${EnvironmentName}/REFUND_24_HOUR_THRESHOLD"
      Type: String
      Value: "24"

  Refund6HourThresholdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/medislot/${EnvironmentName}/REFUND_6_HOUR_THRESHOLD"
      Type: String
      Value: "6"

  RefundMoreThan48HoursPercentParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/medislot/${EnvironmentName}/REFUND_MORE_THAN_48_HOURS_PERCENT"
      Type: String
      Value: "100"

  Refund24To48HoursPercentParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/medislot/${EnvironmentName}/REFUND_24_TO_48_HOURS_PERCENT"
      Type: String
      Value: "75"

  Refund6To24HoursPercentParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/medislot/${EnvironmentName}/REFUND_6_TO_24_HOURS_PERCENT"
      Type: String
      Value: "50"

  RefundLessThan6HoursPercentParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/medislot/${EnvironmentName}/REFUND_LESS_THAN_6_HOURS_PERCENT"
      Type: String
      Value: "0"

  RefundDoctorCancellationPercentParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/medislot/${EnvironmentName}/REFUND_DOCTOR_CANCELLATION_PERCENT"
      Type: String
      Value: "100"

  RefundNoShowPercentParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/medislot/${EnvironmentName}/REFUND_NO_SHOW_PERCENT"
      Type: String
      Value: "0"

  RescheduleCutoffHoursParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/medislot/${EnvironmentName}/RESCHEDULE_CUTOFF_HOURS"
      Type: String
      Value: "6"

  RescheduleMaxAttemptsParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/medislot/${EnvironmentName}/RESCHEDULE_MAX_ATTEMPTS"
      Type: String
      Value: "2"

  MaxActiveWaitlistsParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/medislot/${EnvironmentName}/MAX_ACTIVE_WAITLISTS"
      Type: String
      Value: "5"

  WaitlistOfferDurationMinutesParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/medislot/${EnvironmentName}/WAITLIST_OFFER_DURATION_MINUTES"
      Type: String
      Value: "15"

  NoShowGraceMinutesParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/medislot/${EnvironmentName}/NO_SHOW_GRACE_MINUTES"
      Type: String
      Value: "30"

  Reminder24HoursBeforeParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/medislot/${EnvironmentName}/REMINDER_24_HOURS_BEFORE"
      Type: String
      Value: "24"

  Reminder2HoursBeforeParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/medislot/${EnvironmentName}/REMINDER_2_HOURS_BEFORE"
      Type: String
      Value: "2"

  OfferExpirySweepIntervalMinutesParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/medislot/${EnvironmentName}/OFFER_EXPIRY_SWEEP_INTERVAL_MINUTES"
      Type: String
      Value: "1"

  ReminderSweepIntervalMinutesParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/medislot/${EnvironmentName}/REMINDER_SWEEP_INTERVAL_MINUTES"
      Type: String
      Value: "5"

  NoShowSweepIntervalMinutesParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/medislot/${EnvironmentName}/NO_SHOW_SWEEP_INTERVAL_MINUTES"
      Type: String
      Value: "15"

  NotificationDispatchTtlDaysParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/medislot/${EnvironmentName}/NOTIFICATION_DISPATCH_TTL_DAYS"
      Type: String
      Value: "90"

  RescheduleIdempotencyTtlDaysParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/medislot/${EnvironmentName}/RESCHEDULE_IDEMPOTENCY_TTL_DAYS"
      Type: String
      Value: "90"

Outputs:

  DBSubnetGroupName:
    Description: Database Subnet Group Name
    Value: !Ref DBSubnetGroup
    Export:
      Name: !Sub "${EnvironmentName}-DBSubnetGroup"

  DBEndpoint:
    Description: MySQL Endpoint
    Value: !GetAtt MySQLDatabase.Endpoint.Address
    Export:
      Name: !Sub "${EnvironmentName}-RDSEndpoint"

  DBPort:
    Description: MySQL Port
    Value: !GetAtt MySQLDatabase.Endpoint.Port
    Export:
      Name: !Sub "${EnvironmentName}-RDSPort"

  UserSessionsTableName:
    Value: !Ref UserSessionsTable
    Export:
      Name: !Sub "${EnvironmentName}-UserSessionsTable"

  IdempotencyTableName:
    Value: !Ref IdempotencyKeysTable
    Export:
      Name: !Sub "${EnvironmentName}-IdempotencyKeysTable"

  WaitlistTableName:
    Value: !Ref WaitlistTable
    Export:
      Name: !Sub "${EnvironmentName}-WaitlistTable"

  WaitlistOffersTableName:
    Value: !Ref WaitlistOffersTable
    Export:
      Name: !Sub "${EnvironmentName}-WaitlistOffersTable"

  SlotsTableName:
    Value: !Ref SlotsTable
    Export:
      Name: !Sub "${EnvironmentName}-SlotsTable"

  RescheduleCutoffHours:
    Value: !GetAtt RescheduleCutoffHoursParameter.Value
    Export:
      Name: !Sub "${EnvironmentName}-RescheduleCutoffHours"

  RescheduleMaxAttempts:
    Value: !GetAtt RescheduleMaxAttemptsParameter.Value
    Export:
      Name: !Sub "${EnvironmentName}-RescheduleMaxAttempts"

  WaitlistOfferDurationMinutes:
    Value: !GetAtt WaitlistOfferDurationMinutesParameter.Value
    Export:
      Name: !Sub "${EnvironmentName}-WaitlistOfferDurationMinutes"

  OfferExpirySweepIntervalMinutes:
    Value: !GetAtt OfferExpirySweepIntervalMinutesParameter.Value
    Export:
      Name: !Sub "${EnvironmentName}-OfferExpirySweepIntervalMinutes"

  ReminderSweepIntervalMinutes:
    Value: !GetAtt ReminderSweepIntervalMinutesParameter.Value
    Export:
      Name: !Sub "${EnvironmentName}-ReminderSweepIntervalMinutes"

  NoShowSweepIntervalMinutes:
    Value: !GetAtt NoShowSweepIntervalMinutesParameter.Value
    Export:
      Name: !Sub "${EnvironmentName}-NoShowSweepIntervalMinutes"

  NotificationsTableName:
    Value: !Ref NotificationsTable
    Export:
      Name: !Sub "${EnvironmentName}-NotificationsTable"

  AssetsBucketName:
    Value: !Ref AssetsBucket
    Export:
      Name: !Sub "${EnvironmentName}-AssetsBucket"

  RDSIdentifier:
    Description: RDS Database Identifier
    Value: !Ref MySQLDatabase
    Export:
      Name: !Sub "${EnvironmentName}-RDSIdentifier"