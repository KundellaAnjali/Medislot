AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: MediSlot Patient Profile Stack

Parameters:
  EnvironmentName:
    Type: String

  NotificationSenderEmail:
    Type: String
    Description: Verified Amazon SES email identity used for appointment messages

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256

Resources:
  PatientProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${EnvironmentName}-patient-profile"
      Handler: profile.lambda_handler
      CodeUri: ../lambdas/patient/
      Role:
        Fn::ImportValue: !Sub "${EnvironmentName}-PatientLambdaRoleArn"
      Environment:
        Variables:
          ENVIRONMENT_NAME: !Ref EnvironmentName
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub "${EnvironmentName}-LambdaSecurityGroupId"
        SubnetIds:
          - Fn::ImportValue: !Sub "${EnvironmentName}-PrivateSubnetAId"
          - Fn::ImportValue: !Sub "${EnvironmentName}-PrivateSubnetBId"

  DoctorSearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${EnvironmentName}-doctor-search"
      Handler: doctor_search.lambda_handler
      CodeUri: ../lambdas/patient/
      Role:
        Fn::ImportValue: !Sub "${EnvironmentName}-PatientLambdaRoleArn"
      Environment:
        Variables:
          ENVIRONMENT_NAME: !Ref EnvironmentName
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub "${EnvironmentName}-LambdaSecurityGroupId"
        SubnetIds:
          - Fn::ImportValue: !Sub "${EnvironmentName}-PrivateSubnetAId"
          - Fn::ImportValue: !Sub "${EnvironmentName}-PrivateSubnetBId"

  PublicDoctorProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${EnvironmentName}-doctor-public-profile"
      Handler: doctor_public_profile.lambda_handler
      CodeUri: ../lambdas/patient/
      Role:
        Fn::ImportValue: !Sub "${EnvironmentName}-PatientLambdaRoleArn"
      Environment:
        Variables:
          ENVIRONMENT_NAME: !Ref EnvironmentName
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub "${EnvironmentName}-LambdaSecurityGroupId"
        SubnetIds:
          - Fn::ImportValue: !Sub "${EnvironmentName}-PrivateSubnetAId"
          - Fn::ImportValue: !Sub "${EnvironmentName}-PrivateSubnetBId"

  DoctorAvailabilityFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${EnvironmentName}-doctor-availability"
      Handler: doctor_availability.lambda_handler
      CodeUri: ../lambdas/patient/
      Layers:
        - Fn::ImportValue: !Sub "${EnvironmentName}-SharedSlotQueryLayerArn"
      Role:
        Fn::ImportValue: !Sub "${EnvironmentName}-PatientLambdaRoleArn"
      Environment:
        Variables:
          ENVIRONMENT_NAME: !Ref EnvironmentName
          SLOTS_TABLE_NAME: !Sub "${EnvironmentName}-slots-v2"
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub "${EnvironmentName}-LambdaSecurityGroupId"
        SubnetIds:
          - Fn::ImportValue: !Sub "${EnvironmentName}-PrivateSubnetAId"
          - Fn::ImportValue: !Sub "${EnvironmentName}-PrivateSubnetBId"

  AppointmentBookingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${EnvironmentName}-appointment-booking"
      Handler: appointment_booking.lambda_handler
      CodeUri: ../lambdas/patient/
      Timeout: 30
      MemorySize: 256
      Role:
        Fn::ImportValue: !Sub "${EnvironmentName}-AppointmentLambdaRoleArn"
      Environment:
        Variables:
          ENVIRONMENT_NAME: !Ref EnvironmentName
          SLOTS_TABLE_NAME: !Sub "${EnvironmentName}-slots-v2"
          IDEMPOTENCY_TABLE_NAME: !Sub "${EnvironmentName}-idempotency-keys"
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub "${EnvironmentName}-LambdaSecurityGroupId"
        SubnetIds:
          - Fn::ImportValue: !Sub "${EnvironmentName}-PrivateSubnetAId"
          - Fn::ImportValue: !Sub "${EnvironmentName}-PrivateSubnetBId"

  AppointmentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${EnvironmentName}-appointments"
      Handler: appointments.lambda_handler
      CodeUri: ../lambdas/patient/
      Role:
        Fn::ImportValue: !Sub "${EnvironmentName}-AppointmentLambdaRoleArn"
      Environment:
        Variables:
          ENVIRONMENT_NAME: !Ref EnvironmentName
          SLOTS_TABLE_NAME: !Sub "${EnvironmentName}-slots-v2"
          IDEMPOTENCY_TABLE_NAME: !Sub "${EnvironmentName}-idempotency-keys"
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub "${EnvironmentName}-LambdaSecurityGroupId"
        SubnetIds:
          - Fn::ImportValue: !Sub "${EnvironmentName}-PrivateSubnetAId"
          - Fn::ImportValue: !Sub "${EnvironmentName}-PrivateSubnetBId"

  AppointmentCompletionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${EnvironmentName}-appointment-completion"
      Handler: appointment_completion.lambda_handler
      CodeUri: ../lambdas/patient/
      Timeout: 30
      MemorySize: 256
      Role:
        Fn::ImportValue: !Sub "${EnvironmentName}-AppointmentLambdaRoleArn"
      Environment:
        Variables:
          ENVIRONMENT_NAME: !Ref EnvironmentName
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub "${EnvironmentName}-LambdaSecurityGroupId"
        SubnetIds:
          - Fn::ImportValue: !Sub "${EnvironmentName}-PrivateSubnetAId"
          - Fn::ImportValue: !Sub "${EnvironmentName}-PrivateSubnetBId"

  AppointmentCompletionSchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: Complete appointments after their consultation duration ends
      ScheduleExpression: rate(5 minutes)
      State: ENABLED
      Targets:
        - Id: AppointmentCompletionTarget
          Arn: !GetAtt AppointmentCompletionFunction.Arn

  AppointmentCompletionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AppointmentCompletionFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt AppointmentCompletionSchedule.Arn

  AppointmentEmailNotificationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${EnvironmentName}-appointment-email-notifications"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: notification_id
          AttributeType: S
      KeySchema:
        - AttributeName: notification_id
          KeyType: HASH

  AppointmentNotificationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-appointment-notification-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SendAppointmentEmail
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                Resource:
                  - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${NotificationSenderEmail}"
                Condition:
                  StringEquals:
                    ses:FromAddress: !Ref NotificationSenderEmail
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt AppointmentEmailNotificationsTable.Arn

  AppointmentNotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${EnvironmentName}-appointment-email-notification"
      Handler: appointment_notification.lambda_handler
      CodeUri: ../lambdas/patient/
      Role: !GetAtt AppointmentNotificationRole.Arn
      Environment:
        Variables:
          NOTIFICATION_SENDER_EMAIL: !Ref NotificationSenderEmail
          EMAIL_NOTIFICATIONS_TABLE_NAME: !Ref AppointmentEmailNotificationsTable

  AppointmentBookedNotificationRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Send a patient email when an appointment is booked
      EventPattern:
        source:
          - medislot.appointments
        detail-type:
          - AppointmentBooked
      State: ENABLED
      Targets:
        - Id: AppointmentBookedEmailTarget
          Arn: !GetAtt AppointmentNotificationFunction.Arn

  AppointmentCancelledNotificationRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Send a patient email when an appointment is cancelled
      EventPattern:
        source:
          - medislot.appointments
        detail-type:
          - AppointmentCancelled
      State: ENABLED
      Targets:
        - Id: AppointmentCancelledEmailTarget
          Arn: !GetAtt AppointmentNotificationFunction.Arn

  AppointmentBookedNotificationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AppointmentNotificationFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt AppointmentBookedNotificationRule.Arn

  AppointmentCancelledNotificationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AppointmentNotificationFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt AppointmentCancelledNotificationRule.Arn

  PatientApiAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: !Sub "${EnvironmentName}-patient-jwt-authorizer"
      RestApiId:
        Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiId"
      Type: TOKEN
      IdentitySource: method.request.header.Authorization
      AuthorizerResultTtlInSeconds: 0
      AuthorizerUri:
        Fn::Sub:
          - "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations"
          - FunctionArn:
              Fn::ImportValue: !Sub "${EnvironmentName}-AuthorizerFunctionArn"

  PatientAuthorizerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Fn::ImportValue: !Sub "${EnvironmentName}-AuthorizerFunctionArn"
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub:
          - "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/*/*"
          - ApiId:
              Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiId"

  PatientsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId:
        Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiId"
      ParentId:
        Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiRootResourceId"
      PathPart: patients

  DoctorsSearchResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId:
        Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiId"
      ParentId:
        Fn::ImportValue: !Sub "${EnvironmentName}-DoctorsResourceId"
      PathPart: search

  PublicDoctorProfileDoctorResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId:
        Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiId"
      ParentId:
        Fn::ImportValue: !Sub "${EnvironmentName}-DoctorsResourceId"
      PathPart: "{doctor_id}"

  PublicDoctorProfileResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId:
        Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiId"
      ParentId: !Ref PublicDoctorProfileDoctorResource
      PathPart: profile

  DoctorAvailabilityResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId:
        Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiId"
      ParentId: !Ref PublicDoctorProfileDoctorResource
      PathPart: availability

  PatientMeResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId:
        Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiId"
      ParentId: !Ref PatientsResource
      PathPart: me

  AppointmentsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId:
        Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiId"
      ParentId:
        Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiRootResourceId"
      PathPart: appointments

  AppointmentBookResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId:
        Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiId"
      ParentId: !Ref AppointmentsResource
      PathPart: book

  AppointmentIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId:
        Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiId"
      ParentId: !Ref AppointmentsResource
      PathPart: "{appointment_id}"

  AppointmentCancelResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId:
        Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiId"
      ParentId: !Ref AppointmentIdResource
      PathPart: cancel

  AppointmentNoShowResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId:
        Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiId"
      ParentId: !Ref AppointmentIdResource
      PathPart: no-show

  PatientRefundsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId:
        Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiId"
      ParentId: !Ref PatientsResource
      PathPart: refunds

  PatientMeGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId:
        Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiId"
      ResourceId: !Ref PatientMeResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref PatientApiAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PatientProfileFunction.Arn}/invocations"

  PatientMePutMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId:
        Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiId"
      ResourceId: !Ref PatientMeResource
      HttpMethod: PUT
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref PatientApiAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PatientProfileFunction.Arn}/invocations"

  PatientMeDeleteMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId:
        Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiId"
      ResourceId: !Ref PatientMeResource
      HttpMethod: DELETE
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref PatientApiAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PatientProfileFunction.Arn}/invocations"

  DoctorSearchMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId:
        Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiId"
      ResourceId: !Ref DoctorsSearchResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref PatientApiAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DoctorSearchFunction.Arn}/invocations"

  PublicDoctorProfileMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId:
        Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiId"
      ResourceId: !Ref PublicDoctorProfileResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PublicDoctorProfileFunction.Arn}/invocations"

  DoctorAvailabilityMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId:
        Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiId"
      ResourceId: !Ref DoctorAvailabilityResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref PatientApiAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DoctorAvailabilityFunction.Arn}/invocations"

  AppointmentBookMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId:
        Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiId"
      ResourceId: !Ref AppointmentBookResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref PatientApiAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AppointmentBookingFunction.Arn}/invocations"

  AppointmentsGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId:
        Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiId"
      ResourceId: !Ref AppointmentsResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref PatientApiAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AppointmentsFunction.Arn}/invocations"

  AppointmentGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId:
        Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiId"
      ResourceId: !Ref AppointmentIdResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref PatientApiAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AppointmentsFunction.Arn}/invocations"

  AppointmentCancelMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId:
        Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiId"
      ResourceId: !Ref AppointmentCancelResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref PatientApiAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AppointmentsFunction.Arn}/invocations"

  AppointmentNoShowMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId:
        Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiId"
      ResourceId: !Ref AppointmentNoShowResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref PatientApiAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AppointmentsFunction.Arn}/invocations"

  PatientRefundsGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId:
        Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiId"
      ResourceId: !Ref PatientRefundsResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref PatientApiAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AppointmentsFunction.Arn}/invocations"

  PatientProfileInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PatientProfileFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub:
          - "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/*/patients/*"
          - ApiId:
              Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiId"

  DoctorSearchInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DoctorSearchFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub:
          - "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/GET/doctors/search"
          - ApiId:
              Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiId"

  PublicDoctorProfileInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PublicDoctorProfileFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub:
          - "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/GET/doctors/*/profile"
          - ApiId:
              Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiId"

  DoctorAvailabilityInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DoctorAvailabilityFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub:
          - "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/GET/doctors/*/availability"
          - ApiId:
              Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiId"

  AppointmentBookingInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AppointmentBookingFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub:
          - "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/POST/appointments/book"
          - ApiId:
              Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiId"

  AppointmentsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AppointmentsFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub:
          - "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/GET/appointments*"
          - ApiId:
              Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiId"

  AppointmentCancelInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AppointmentsFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub:
          - "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/POST/appointments/*/cancel"
          - ApiId:
              Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiId"

  AppointmentNoShowInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AppointmentsFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub:
          - "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/POST/appointments/*/no-show"
          - ApiId:
              Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiId"

  PatientRefundsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AppointmentsFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub:
          - "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/GET/patients/refunds"
          - ApiId:
              Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiId"

Outputs:
  PatientProfileFunctionName:
    Value: !Ref PatientProfileFunction
  DoctorSearchFunctionName:
    Value: !Ref DoctorSearchFunction
  PublicDoctorProfileFunctionName:
    Value: !Ref PublicDoctorProfileFunction
  DoctorAvailabilityFunctionName:
    Value: !Ref DoctorAvailabilityFunction
  AppointmentBookingFunctionName:
    Value: !Ref AppointmentBookingFunction
  AppointmentsFunctionName:
    Value: !Ref AppointmentsFunction
