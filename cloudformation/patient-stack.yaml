AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: MediSlot Patient Profile Stack

Parameters:
  EnvironmentName:
    Type: String

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256

Resources:
  PatientProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${EnvironmentName}-patient-profile"
      Handler: profile.lambda_handler
      CodeUri: ../lambdas/patient/
      Role:
        Fn::ImportValue: !Sub "${EnvironmentName}-PatientLambdaRoleArn"
      Environment:
        Variables:
          ENVIRONMENT_NAME: !Ref EnvironmentName
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub "${EnvironmentName}-LambdaSecurityGroupId"
        SubnetIds:
          - Fn::ImportValue: !Sub "${EnvironmentName}-PrivateSubnetAId"
          - Fn::ImportValue: !Sub "${EnvironmentName}-PrivateSubnetBId"

  PatientApiAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: !Sub "${EnvironmentName}-patient-jwt-authorizer"
      RestApiId:
        Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiId"
      Type: TOKEN
      IdentitySource: method.request.header.Authorization
      AuthorizerResultTtlInSeconds: 0
      AuthorizerUri:
        Fn::Sub:
          - "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations"
          - FunctionArn:
              Fn::ImportValue: !Sub "${EnvironmentName}-AuthorizerFunctionArn"

  PatientAuthorizerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Fn::ImportValue: !Sub "${EnvironmentName}-AuthorizerFunctionArn"
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub:
          - "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/*/*"
          - ApiId:
              Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiId"

  PatientsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId:
        Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiId"
      ParentId:
        Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiRootResourceId"
      PathPart: patients

  PatientRegisterResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId:
        Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiId"
      ParentId: !Ref PatientsResource
      PathPart: register

  PatientMeResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId:
        Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiId"
      ParentId: !Ref PatientsResource
      PathPart: me

  PatientRegisterMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId:
        Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiId"
      ResourceId: !Ref PatientRegisterResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref PatientApiAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PatientProfileFunction.Arn}/invocations"

  PatientMeGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId:
        Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiId"
      ResourceId: !Ref PatientMeResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref PatientApiAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PatientProfileFunction.Arn}/invocations"

  PatientMePutMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId:
        Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiId"
      ResourceId: !Ref PatientMeResource
      HttpMethod: PUT
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref PatientApiAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PatientProfileFunction.Arn}/invocations"

  PatientMeDeleteMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId:
        Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiId"
      ResourceId: !Ref PatientMeResource
      HttpMethod: DELETE
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref PatientApiAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PatientProfileFunction.Arn}/invocations"

  PatientProfileInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PatientProfileFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub:
          - "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/*/patients/*"
          - ApiId:
              Fn::ImportValue: !Sub "${EnvironmentName}-MedislotApiId"

Outputs:
  PatientProfileFunctionName:
    Value: !Ref PatientProfileFunction
