name: Infrastructure Deployment

on:
  push:
    branches:
      - main
      - feature/**

permissions:
  id-token: write
  contents: read

jobs:

  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Validation Tools
        run: |
          python -m pip install --upgrade pip
          pip install cfn-lint

      - name: Install Application Test Dependencies
        run: |
          pip install -r lambdas/doctor/requirements.txt
          pip install -r web/doctor-portal/requirements.txt

      - name: Test Slot Materialization
        run: |
          python -m unittest discover -s lambdas/doctor -p 'test_*.py'

      - name: Smoke Test Doctor Portal
        env:
          FLASK_SECRET_KEY: ci-only-session-key
          MEDISLOT_API_BASE_URL: https://example.invalid/dev
        run: |
          cd web/doctor-portal
          python -m unittest discover -s . -p 'test_*.py'
          python -c "from app import app; client=app.test_client(); assert client.get('/').status_code == 200; assert client.get('/doctor/register').status_code == 200; assert client.get('/doctor/login').status_code == 200"

      - name: Lint Network Stack
        run: |
          cfn-lint cloudformation/network-stack.yaml

      - name: Lint Data Stack
        run: |
          cfn-lint --ignore-checks E3691 -- cloudformation/data-stack.yaml

      - name: Lint IAM Stack
        run: |
          cfn-lint cloudformation/iam-stack.yaml

      - name: Lint Auth Stack
        run: |
          cfn-lint cloudformation/auth-stack.yaml

      - name: Lint Doctor Stack
        run: |
          cfn-lint cloudformation/doctor-stack.yaml

  deploy-network:
    needs: validate
    runs-on: ubuntu-latest

    env:
      TEMPLATE_FILE: cloudformation/network-stack.yaml
      PARAMETERS_FILE: parameters/network-parameters.json

    steps:
      - uses: actions/checkout@v4

      - name: Load Parameters
        run: |
          echo "ENVIRONMENT=$(jq -r '.[] | select(.ParameterKey=="EnvironmentName") | .ParameterValue' ${{ env.PARAMETERS_FILE }})" >> $GITHUB_ENV

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate Network Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://${{ env.TEMPLATE_FILE }}

      - name: Deploy Network Stack
        run: |
          aws cloudformation deploy \
            --template-file ${{ env.TEMPLATE_FILE }} \
            --stack-name ${ENVIRONMENT}-medislot-network-stack \
            --parameter-overrides \
            $(jq -r '.[] | "\(.ParameterKey)=\(.ParameterValue)"' ${{ env.PARAMETERS_FILE }}) \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --region ${{ secrets.AWS_REGION }}

  deploy-data:
    needs: deploy-network
    runs-on: ubuntu-latest

    env:
      TEMPLATE_FILE: cloudformation/data-stack.yaml
      PARAMETERS_FILE: parameters/data-parameters.json

    steps:
      - uses: actions/checkout@v4

      - name: Load Parameters
        run: |
          echo "ENVIRONMENT=$(jq -r '.[] | select(.ParameterKey=="EnvironmentName") | .ParameterValue' ${{ env.PARAMETERS_FILE }})" >> $GITHUB_ENV

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate Data Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://${{ env.TEMPLATE_FILE }}

      - name: Deploy Data Stack
        run: |
          aws cloudformation deploy \
            --template-file ${{ env.TEMPLATE_FILE }} \
            --stack-name ${ENVIRONMENT}-medislot-data-stack \
            --parameter-overrides \
            $(jq -r '.[] | "\(.ParameterKey)=\(.ParameterValue)"' ${{ env.PARAMETERS_FILE }}) \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --region ${{ secrets.AWS_REGION }}

  deploy-iam:
    needs: deploy-data
    runs-on: ubuntu-latest

    env:
      TEMPLATE_FILE: cloudformation/iam-stack.yaml
      PARAMETERS_FILE: parameters/iam-parameters.json

    steps:
      - uses: actions/checkout@v4

      - name: Load Parameters
        run: |
          echo "ENVIRONMENT=$(jq -r '.[] | select(.ParameterKey=="EnvironmentName") | .ParameterValue' ${{ env.PARAMETERS_FILE }})" >> $GITHUB_ENV

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate IAM Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://${{ env.TEMPLATE_FILE }}

      - name: Deploy IAM Stack
        run: |
          aws cloudformation deploy \
            --template-file ${{ env.TEMPLATE_FILE }} \
            --stack-name ${ENVIRONMENT}-medislot-iam-stack \
            --parameter-overrides \
            $(jq -r '.[] | "\(.ParameterKey)=\(.ParameterValue)"' ${{ env.PARAMETERS_FILE }}) \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --region ${{ secrets.AWS_REGION }}

  deploy-auth:
    needs: deploy-iam
    runs-on: ubuntu-latest

    env:
      TEMPLATE_FILE: cloudformation/auth-stack.yaml
      PARAMETERS_FILE: parameters/auth-parameters.json

    steps:
      - uses: actions/checkout@v4

      - name: Load Parameters
        run: |
          echo "ENVIRONMENT=$(jq -r '.[] | select(.ParameterKey=="EnvironmentName") | .ParameterValue' ${{ env.PARAMETERS_FILE }})" >> $GITHUB_ENV

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Validate SAM Template
        run: |
          sam validate \
            --template-file ${{ env.TEMPLATE_FILE }}

      - name: Build Auth Stack
        run: |
          sam build \
            --template-file ${{ env.TEMPLATE_FILE }}

      - name: Deploy Auth Stack
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name ${ENVIRONMENT}-medislot-auth-stack \
            --parameter-overrides \
            EnvironmentName=${ENVIRONMENT} \
            --capabilities CAPABILITY_NAMED_IAM \
            --resolve-s3 \
            --no-fail-on-empty-changeset \
            --region ${{ secrets.AWS_REGION }}

      - name: Execute Schema Initialization
        run: |
          aws lambda invoke \
            --function-name ${ENVIRONMENT}-schema-init \
            response.json \
            --region ${{ secrets.AWS_REGION }}

          cat response.json

      - name: Verify Auth Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name ${ENVIRONMENT}-medislot-auth-stack \
            --region ${{ secrets.AWS_REGION }} \
            --query "Stacks[0].StackStatus"

      - name: Display Auth Outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name ${ENVIRONMENT}-medislot-auth-stack \
            --region ${{ secrets.AWS_REGION }} \
            --query "Stacks[0].Outputs"

  deploy-doctor:
    needs: deploy-auth
    runs-on: ubuntu-latest

    env:
      TEMPLATE_FILE: cloudformation/doctor-stack.yaml
      PARAMETERS_FILE: parameters/doctor-parameters.json

    steps:
      - uses: actions/checkout@v4

      - name: Load Parameters
        run: |
          ENVIRONMENT=$(jq -r '.[] | select(.ParameterKey=="EnvironmentName") | .ParameterValue' parameters/doctor-parameters.json)

          echo "ENVIRONMENT=$ENVIRONMENT" >> $GITHUB_ENV

          echo "Loaded Environment: $ENVIRONMENT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
      - name: Debug Environment
        run: |
          echo "ENVIRONMENT=${ENVIRONMENT}"
          cat parameters/doctor-parameters.json

      - name: Upload Doctor Portal Artifact
        run: |
          cd web/doctor-portal
          zip -r ../../doctor-portal.zip .
          cd ../..

          echo "ENVIRONMENT=${ENVIRONMENT}"

          ASSETS_BUCKET=$(aws cloudformation list-exports \
            --region ${{ secrets.AWS_REGION }} \
            --query "Exports[?Name=='${ENVIRONMENT}-AssetsBucket'].Value | [0]" \
            --output text)

          echo "ASSETS_BUCKET=${ASSETS_BUCKET}"

          aws s3 cp doctor-portal.zip \
            "s3://${ASSETS_BUCKET}/doctor-portal/doctor-portal.zip" \
            --region ${{ secrets.AWS_REGION }}
      - name: Validate Doctor Stack
        run: |
          sam validate \
            --template-file ${{ env.TEMPLATE_FILE }}

      - name: Build Doctor Stack
        run: |
          sam build \
            --template-file ${{ env.TEMPLATE_FILE }}

      - name: Deploy Doctor Stack
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name ${ENVIRONMENT}-medislot-doctor-stack \
            --parameter-overrides \
            EnvironmentName=${ENVIRONMENT} \
            --capabilities CAPABILITY_NAMED_IAM \
            --resolve-s3 \
            --no-fail-on-empty-changeset \
            --region ${{ secrets.AWS_REGION }}

      - name: Publish Doctor Routes to Existing API Stage
        run: |
          API_ID=$(aws cloudformation list-exports \
            --region ${{ secrets.AWS_REGION }} \
            --query "Exports[?Name=='${ENVIRONMENT}-MedislotApiId'].Value | [0]" \
            --output text)

          aws apigateway create-deployment \
            --rest-api-id "$API_ID" \
            --stage-name "$ENVIRONMENT" \
            --description "Publish MediSlot doctor-domain routes" \
            --region ${{ secrets.AWS_REGION }}