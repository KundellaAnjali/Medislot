name: Infrastructure Deployment

on:
  push:
    branches:
      - main
      - feature/**

permissions:
  id-token: write
  contents: read
  
jobs:

  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Validation Tools
        run: |
          python -m pip install --upgrade pip
          pip install cfn-lint

      - name: Install Portal Runtime Dependencies
        run: |
          pip install -r web/doctor-portal/requirements.txt

      - name: Smoke Test Doctor Portal
        env:
          FLASK_SECRET_KEY: ci-only-session-key
          MEDISLOT_API_BASE_URL: https://example.invalid/dev
        run: |
          cd web/doctor-portal
          python -c "from app import app; client=app.test_client(); assert client.get('/auth').status_code == 200; assert client.get('/auth?mode=register&role=DOCTOR').status_code == 200; assert client.get('/auth?mode=login&role=PATIENT').status_code == 200; assert client.get('/').headers['Location'].endswith('/auth?mode=login'); assert client.get('/dashboard/patient').headers['Location'].endswith('/auth?mode=login&role=PATIENT'); assert client.get('/dashboard/doctor').headers['Location'].endswith('/auth?mode=login&role=DOCTOR'); assert client.get('/debug-session').status_code == 404"

      - name: Lint Network Stack
        run: |
          cfn-lint cloudformation/network-stack.yaml

      - name: Lint Data Stack
        run: |
          cfn-lint --ignore-checks E3691 -- cloudformation/data-stack.yaml

      - name: Lint IAM Stack
        run: |
          cfn-lint cloudformation/iam-stack.yaml

      - name: Lint Auth Stack
        run: |
          cfn-lint cloudformation/auth-stack.yaml

      - name: Lint Doctor Stack
        run: |
          cfn-lint cloudformation/doctor-stack.yaml

      - name: Lint Patient Stack
        run: |
          cfn-lint cloudformation/patient-stack.yaml

  deploy-network:
    needs: validate
    runs-on: ubuntu-latest

    env:
      TEMPLATE_FILE: cloudformation/network-stack.yaml
      PARAMETERS_FILE: parameters/network-parameters.json

    steps:
      - uses: actions/checkout@v4

      - name: Load Parameters
        run: |
          echo "ENVIRONMENT=$(jq -r '.[] | select(.ParameterKey=="EnvironmentName") | .ParameterValue' ${{ env.PARAMETERS_FILE }})" >> $GITHUB_ENV

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate Network Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://${{ env.TEMPLATE_FILE }}

      - name: Deploy Network Stack
        run: |
          aws cloudformation deploy \
            --template-file ${{ env.TEMPLATE_FILE }} \
            --stack-name ${ENVIRONMENT}-medislot-network-stack \
            --parameter-overrides \
            $(jq -r '.[] | "\(.ParameterKey)=\(.ParameterValue)"' ${{ env.PARAMETERS_FILE }}) \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --region ${{ secrets.AWS_REGION }}

  deploy-data:
    needs: deploy-network
    runs-on: ubuntu-latest

    env:
      TEMPLATE_FILE: cloudformation/data-stack.yaml
      PARAMETERS_FILE: parameters/data-parameters.json

    steps:
      - uses: actions/checkout@v4

      - name: Load Parameters
        run: |
          echo "ENVIRONMENT=$(jq -r '.[] | select(.ParameterKey=="EnvironmentName") | .ParameterValue' ${{ env.PARAMETERS_FILE }})" >> $GITHUB_ENV

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate Data Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://${{ env.TEMPLATE_FILE }}

      - name: Deploy Data Stack
        run: |
          aws cloudformation deploy \
            --template-file ${{ env.TEMPLATE_FILE }} \
            --stack-name ${ENVIRONMENT}-medislot-data-stack \
            --parameter-overrides \
            $(jq -r '.[] | "\(.ParameterKey)=\(.ParameterValue)"' ${{ env.PARAMETERS_FILE }}) \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --region ${{ secrets.AWS_REGION }}

  deploy-iam:
    needs: deploy-data
    runs-on: ubuntu-latest

    env:
      TEMPLATE_FILE: cloudformation/iam-stack.yaml
      PARAMETERS_FILE: parameters/iam-parameters.json

    steps:
      - uses: actions/checkout@v4

      - name: Load Parameters
        run: |
          echo "ENVIRONMENT=$(jq -r '.[] | select(.ParameterKey=="EnvironmentName") | .ParameterValue' ${{ env.PARAMETERS_FILE }})" >> $GITHUB_ENV

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate IAM Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://${{ env.TEMPLATE_FILE }}

      - name: Deploy IAM Stack
        run: |
          aws cloudformation deploy \
            --template-file ${{ env.TEMPLATE_FILE }} \
            --stack-name ${ENVIRONMENT}-medislot-iam-stack \
            --parameter-overrides \
            $(jq -r '.[] | "\(.ParameterKey)=\(.ParameterValue)"' ${{ env.PARAMETERS_FILE }}) \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --region ${{ secrets.AWS_REGION }}

  deploy-auth:
    needs: deploy-iam
    runs-on: ubuntu-latest

    env:
      TEMPLATE_FILE: cloudformation/auth-stack.yaml
      PARAMETERS_FILE: parameters/auth-parameters.json

    steps:
      - uses: actions/checkout@v4

      - name: Load Parameters
        run: |
          echo "ENVIRONMENT=$(jq -r '.[] | select(.ParameterKey=="EnvironmentName") | .ParameterValue' ${{ env.PARAMETERS_FILE }})" >> $GITHUB_ENV

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Python 3.12 for SAM
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Expose Python 3.12 to SAM
        run: |
          sudo ln -sf "$(command -v python)" /usr/bin/python
          /usr/bin/python --version

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Validate SAM Template
        run: |
          sam validate \
            --template-file ${{ env.TEMPLATE_FILE }}

      - name: Build Auth Stack
        run: |
          sam build \
            --template-file ${{ env.TEMPLATE_FILE }}

      - name: Deploy Auth Stack
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name ${ENVIRONMENT}-medislot-auth-stack \
            --parameter-overrides \
            EnvironmentName=${ENVIRONMENT} \
            --capabilities CAPABILITY_NAMED_IAM \
            --resolve-s3 \
            --no-fail-on-empty-changeset \
            --region ${{ secrets.AWS_REGION }}

      - name: Execute Schema Initialization
        run: |
          aws lambda invoke \
            --function-name ${ENVIRONMENT}-schema-init \
            response.json \
            --region ${{ secrets.AWS_REGION }}

          cat response.json

      - name: Verify Auth Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name ${ENVIRONMENT}-medislot-auth-stack \
            --region ${{ secrets.AWS_REGION }} \
            --query "Stacks[0].StackStatus"

      - name: Display Auth Outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name ${ENVIRONMENT}-medislot-auth-stack \
            --region ${{ secrets.AWS_REGION }} \
            --query "Stacks[0].Outputs"

  deploy-doctor:
    needs: deploy-auth
    runs-on: ubuntu-latest

    env:
      TEMPLATE_FILE: cloudformation/doctor-stack.yaml
      PARAMETERS_FILE: parameters/doctor-parameters.json

    steps:
      - uses: actions/checkout@v4

      - name: Load Parameters
        run: |
          ENVIRONMENT=$(jq -r '.[] | select(.ParameterKey=="EnvironmentName") | .ParameterValue' parameters/doctor-parameters.json)
          PORTAL_KEY_NAME=$(jq -r '.[] | select(.ParameterKey=="PortalKeyName") | .ParameterValue' parameters/doctor-parameters.json)

          echo "ENVIRONMENT=$ENVIRONMENT" >> $GITHUB_ENV
          echo "PORTAL_KEY_NAME=$PORTAL_KEY_NAME" >> $GITHUB_ENV

          echo "Loaded Environment: $ENVIRONMENT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Python 3.12 for SAM
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Expose Python 3.12 to SAM
        run: |
          sudo ln -sf "$(command -v python)" /usr/bin/python
          /usr/bin/python --version

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
      - name: Debug Environment
        run: |
          echo "ENVIRONMENT=${ENVIRONMENT}"
          cat parameters/doctor-parameters.json

      - name: Upload Doctor Portal Artifact
        run: |
          cd web/doctor-portal
          zip -r ../../doctor-portal.zip . -x '*/__pycache__/*' '__pycache__/*' '*.pyc'
          cd ../..

          echo "ENVIRONMENT=${ENVIRONMENT}"

          ASSETS_BUCKET=$(aws cloudformation list-exports \
            --region ${{ secrets.AWS_REGION }} \
            --query "Exports[?Name=='${ENVIRONMENT}-AssetsBucket'].Value | [0]" \
            --output text)

          echo "ASSETS_BUCKET=${ASSETS_BUCKET}"

          aws s3 cp doctor-portal.zip \
            "s3://${ASSETS_BUCKET}/doctor-portal/doctor-portal.zip" \
            --region ${{ secrets.AWS_REGION }}
      - name: Validate Doctor Stack
        run: |
          sam validate \
            --template-file ${{ env.TEMPLATE_FILE }}

      - name: Build Doctor Stack
        run: |
          sam build \
            --template-file ${{ env.TEMPLATE_FILE }}

      - name: Deploy Doctor Stack
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name ${ENVIRONMENT}-medislot-doctor-stack \
            --parameter-overrides EnvironmentName=${ENVIRONMENT} PortalKeyName=${PORTAL_KEY_NAME} \
            --capabilities CAPABILITY_NAMED_IAM \
            --resolve-s3 \
            --no-fail-on-empty-changeset \
            --region ${{ secrets.AWS_REGION }}

      - name: Update Running Doctor Portal
        run: |
          INSTANCE_ID=$(aws cloudformation describe-stack-resource \
            --stack-name ${ENVIRONMENT}-medislot-doctor-stack \
            --logical-resource-id DoctorPortalInstance \
            --query "StackResourceDetail.PhysicalResourceId" \
            --output text \
            --region ${{ secrets.AWS_REGION }})

          ASSETS_BUCKET=$(aws cloudformation list-exports \
            --region ${{ secrets.AWS_REGION }} \
            --query "Exports[?Name=='${ENVIRONMENT}-AssetsBucket'].Value | [0]" \
            --output text)

          for attempt in $(seq 1 60); do
            PING_STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${INSTANCE_ID}" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text \
              --region ${{ secrets.AWS_REGION }})
            if [ "$PING_STATUS" = "Online" ]; then
              break
            fi
            sleep 10
          done

          if [ "$PING_STATUS" != "Online" ]; then
            echo "Doctor portal instance $INSTANCE_ID did not become available in Systems Manager." >&2
            echo "Current EC2 instance state and profile:" >&2
            aws ec2 describe-instances \
              --instance-ids "$INSTANCE_ID" \
              --query "Reservations[0].Instances[0].{State:State.Name,Subnet:SubnetId,SecurityGroups:SecurityGroups[*].GroupId,IamProfile:IamInstanceProfile.Arn}" \
              --output table \
              --region ${{ secrets.AWS_REGION }} >&2
            echo "Current Systems Manager registration:" >&2
            aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${INSTANCE_ID}" \
              --output json \
              --region ${{ secrets.AWS_REGION }} >&2
            echo "Check the portal role, SSM agent status, and HTTPS access to the SSM VPC endpoint." >&2
            exit 1
          fi

          cat > /tmp/portal-update.sh <<'SCRIPT'
          #!/bin/bash
          set -eu

          echo "Waiting for EC2 UserData bootstrap to finish..."
          cloud-init status --wait

          test -d /opt/medislot/doctor-portal || {
            echo "Doctor portal directory was not created by EC2 UserData." >&2
            exit 1
          }
          test -x /opt/medislot/venv/bin/pip || {
            echo "Doctor portal virtual environment was not created by EC2 UserData." >&2
            exit 1
          }
          test -f /opt/medislot/doctor-portal/requirements.txt || {
            echo "Doctor portal requirements file is missing after EC2 UserData." >&2
            exit 1
          }

          echo "Bootstrap is ready. Updating the doctor portal..."
          aws s3 cp "s3://${ASSETS_BUCKET}/doctor-portal/doctor-portal.zip" /tmp/doctor-portal.zip
          unzip -o /tmp/doctor-portal.zip -d /opt/medislot/doctor-portal
          chown -R ec2-user:ec2-user /opt/medislot/doctor-portal
          /opt/medislot/venv/bin/pip install --no-cache-dir -r /opt/medislot/doctor-portal/requirements.txt
          systemctl restart medislot-doctor-portal
          SCRIPT

          COMMAND_SCRIPT=$(printf 'ASSETS_BUCKET=%s\n' "$ASSETS_BUCKET"; cat /tmp/portal-update.sh)
          rm /tmp/portal-update.sh
          COMMAND_PARAMETERS=$(jq -n \
            --arg command "$COMMAND_SCRIPT" \
            '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$COMMAND_PARAMETERS" \
            --timeout-seconds 3600 \
            --query "Command.CommandId" \
            --output text \
            --region ${{ secrets.AWS_REGION }})

          for attempt in $(seq 1 720); do
            COMMAND_STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text \
              --region ${{ secrets.AWS_REGION }} 2>/dev/null || echo "Pending")

            case "$COMMAND_STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text \
                  --region ${{ secrets.AWS_REGION }}
                break
                ;;
              Failed|TimedOut|Cancelled|DeliveryTimedOut|ExecutionTimedOut|Undeliverable|Terminated|InvalidPlatform|AccessDenied)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "{Status:Status,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}" \
                  --output json \
                  --region ${{ secrets.AWS_REGION }}
                exit 1
                ;;
            esac

            if [ "$attempt" -eq 720 ]; then
              echo "Timed out waiting for the doctor portal update command." >&2
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "{Status:Status,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}" \
                --output json \
                --region ${{ secrets.AWS_REGION }} || true
              exit 1
            fi
            sleep 5
          done

      - name: Publish Doctor Routes to Existing API Stage
        run: |
          API_ID=$(aws cloudformation list-exports \
            --region ${{ secrets.AWS_REGION }} \
            --query "Exports[?Name=='${ENVIRONMENT}-MedislotApiId'].Value | [0]" \
            --output text)

          aws apigateway create-deployment \
            --rest-api-id "$API_ID" \
            --stage-name "$ENVIRONMENT" \
            --description "Publish MediSlot doctor-domain routes" \
            --region ${{ secrets.AWS_REGION }}

  deploy-patient:
    needs: deploy-doctor
    runs-on: ubuntu-latest

    env:
      TEMPLATE_FILE: cloudformation/patient-stack.yaml
      PARAMETERS_FILE: parameters/auth-parameters.json

    steps:
      - uses: actions/checkout@v4

      - name: Load Environment
        run: |
          echo "ENVIRONMENT=$(jq -r '.[] | select(.ParameterKey=="EnvironmentName") | .ParameterValue' ${{ env.PARAMETERS_FILE }})" >> $GITHUB_ENV

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Python 3.12 for SAM
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Expose Python 3.12 to SAM
        run: |
          sudo ln -sf "$(command -v python)" /usr/bin/python
          /usr/bin/python --version

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Validate Patient Stack
        run: |
          sam validate \
            --template-file ${{ env.TEMPLATE_FILE }}

      - name: Build Patient Stack
        run: |
          sam build \
            --template-file ${{ env.TEMPLATE_FILE }}

      - name: Deploy Patient Stack
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name ${ENVIRONMENT}-medislot-patient-stack \
            --parameter-overrides EnvironmentName=${ENVIRONMENT} \
            --capabilities CAPABILITY_NAMED_IAM \
            --resolve-s3 \
            --no-fail-on-empty-changeset \
            --region ${{ secrets.AWS_REGION }}

      - name: Publish Patient Routes to Existing API Stage
        run: |
          API_ID=$(aws cloudformation list-exports \
            --region ${{ secrets.AWS_REGION }} \
            --query "Exports[?Name=='${ENVIRONMENT}-MedislotApiId'].Value | [0]" \
            --output text)

          aws apigateway create-deployment \
            --rest-api-id "$API_ID" \
            --stage-name "$ENVIRONMENT" \
            --description "Publish MediSlot patient-profile routes" \
            --region ${{ secrets.AWS_REGION }}
